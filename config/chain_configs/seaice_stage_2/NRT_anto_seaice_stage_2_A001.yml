# CPOM sea ice chain settings

# Set breakpoint file directory
breakpoint_files:
  default_dir: ${HOME}/sea_ice_processor/bp_files/stage_2/south
  
# Default locations for log files
log_files:
  append_year_month_to_logname: true  # if chain is run for specific month and year, use <logtype>_MMYYYY.log
                                      # or <logtype>_YYYY.log (if only year specified) 
  errors: ${SI_LOG_DIR}/stage_2/errors.log    # or errors_MMYYYY.log
  info:   ${SI_LOG_DIR}/stage_2/info.log
  debug:  ${SI_LOG_DIR}/stage_2/debug.log

# CS2 instrument parameters
instrument:
  num_range_bins_lrm: 128
  # etc

# Geophysical parameters
geophysical:
  earth_semi_major: 6378137.0
  eccentricity: 0.08181919078479198
  speed_light_vacuum: 299792458.0
  speed_light_snow:   240000000.0 #2.4e8
  earth_radius: 6356.752

# Algorithm configuration settings

shared: # Shared config parameters for multiple algorithms to use
  min_latitude: -90.0 # minimum latitude in degs N
  max_latitude: -50.0 # maximum latitude in deg N
  min_longitude: 0.00 # minimum longitude in degs E
  max_longitude: 360.00 # maximum longitude in deg E
  output_projection: epsg:3412 # projection used within chain
  aux_file_path: ${HOME}/sea_ice_processor/aux_files/
  grid_nlons: 720
  grid_nlats: 500
  hemisphere: south
  nrt: True

stage_2_file_finder:
  merge_base_dir: /home/benpalmer/sea_ice_processor/NRT_data/south/merge_files
  sort_files: True

alg_add_mss:
  mss_file: /home/benpalmer/sea_ice_processor/CryosatMSS-anto-1yr-160316.zarr 
  input_projection: epsg:4326
  delta: 0.0625
  nlons: 5761
  nlats: 2689
  mss_lat_min: -80
  mss_lon_min: 0

alg_add_si_type:
  type_file_dir: ${HOME}/sea_ice_processor/aux_files/si_type
  max_distance: 10000

alg_dynamic_snow_load:
  enabled: True
  data_dir: /home/andyridout/src/dynamic_snowload/compute_snowload/DATA/links_results_Climat/
  grid_xymin  : -5800
  grid_xymax  : 5800
  grid_xystep : 10
  cog_max: 30.0

alg_sla_calculations:
  raw_sla_clip_value: 3.0
  sla_track_limit: 0.5
  lead_sample_limit: 20.0
  window_range: 100 # range limit between floes and leads in either direction in km
  distance_projection: WGS84 # projection used to calculate distance between lat/lon pairs while interpolating

alg_fbd_calculations:
  fb_min: -0.3
  fb_max: 3.0
  correction_method: penetration
  mfit: 0.2268
  cfit: 0.0901

alg_thk_calculations:
  rho_fyi: 916.7
  rho_myi: 882.0
  rho_sea: 1023.9

alg_floe_chord_length:
    max_distance: 0.8 # max distance in km
    include_bad: True
    include_all: False

alg_output_nc:
  output_dir: /home/benpalmer/sea_ice_processor/NRT_data/south/arc_files/

alg_merge_months:
  merge_file_dir: /home/benpalmer/sea_ice_processor/NRT_data/south/period_files/
  mp_file_timeout: 60

alg_merge_nrt_periods:
  merge_file_dir: /home/benpalmer/sea_ice_processor/NRT_data/south/period_files/
  mp_file_timeout: 60
  period_lengths:
    - 2
    - 14
    - 28
# Resource Locators
